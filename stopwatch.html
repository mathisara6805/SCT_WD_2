
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Stopwatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>⏱ Stopwatch</h1>

    <div class="time-display" id="display">00:00:00</div>

    <div class="buttons">
      <button class="start" id="startBtn">Start</button>
      <button class="pause" id="pauseBtn">Pause</button>
      <button class="reset" id="resetBtn">Reset</button>
      <button class="lap" id="lapBtn">Lap</button>
    </div>

    <h3>Lap Times</h3>
    <ul id="laps"></ul>

    <button class="clear" id="clearBtn">Clear Laps</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
